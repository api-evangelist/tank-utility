aid: tank-utility
name: Tank Utility
description: >-
  Tank Utility makes LTE-connected propane tank monitors, mobile apps, and a
  read-only API that surface their data. Its sensors report tank fuel level,
  temperature, and battery state so homeowners get low-fuel alerts and fuel
  marketers can route deliveries by real consumption instead of guesswork —
  Tank Utility says this drops the same gallons in up to 40% fewer deliveries.
  The Tank Utility API lets an account exchange credentials (HTTP Basic) for a
  short-lived token, list the monitors on the account, and read each device's
  latest reading. Tank Utility is owned by Anova.
